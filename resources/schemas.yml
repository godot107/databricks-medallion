# Unity Catalog layout: one schema per medallion layer, an ops schema, and a volume for raw files.
# Tags, row filters and the access map are applied by the job's governance task
# (src/medallion/governance.py), because tables aren't bundle resources.
# Deploying creates them; `databricks bundle destroy` removes them (and their tables).
resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Raw rows as ingested, plus _ingested_at and _source. Replayable record.
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Validated, de-duplicated trips with derived fields; rejects kept beside them.
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: Business-ready aggregates (daily trips and revenue per pickup ZIP). Row-filtered by borough.
    ops:
      catalog_name: ${var.catalog}
      name: ops
      comment: Pipeline run metrics, row-level-security access map and filter functions, dashboard views.

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: landing
      volume_type: MANAGED
      comment: Drop zone for raw files (future Auto Loader ingestion).
