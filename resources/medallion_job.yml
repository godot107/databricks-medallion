# One job, three tasks: bronze -> silver -> gold. Serverless compute (no cluster
# config), which is what Free Edition offers and the cheapest option on AWS/Azure too.
resources:
  jobs:
    medallion_daily:
      name: medallion-daily
      tags:
        project: databricks-medallion
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # 06:00 daily
        timezone_id: America/Chicago
      max_concurrent_runs: 1

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: medallion
            entry_point: bronze
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.bronze.name}
              - --source_table=${var.source_table}

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          python_wheel_task:
            package_name: medallion
            entry_point: silver
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.silver.name}
              - --bronze_schema=${resources.schemas.bronze.name}
              - --max_reject_rate=${var.max_reject_rate}

        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          python_wheel_task:
            package_name: medallion
            entry_point: gold
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.gold.name}
              - --silver_schema=${resources.schemas.silver.name}
